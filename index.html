<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#c9632e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<title>캥거루 점프</title>
<style>
  :root { --brown: #6b3416; --brown2: #8a4a22; --cream: #fff4e4; --orange: #e9773a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffe6c4; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
         font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: var(--brown); word-break: keep-all; }
  canvas#c { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; }
  .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column;
            padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  .screen.on { display: flex; }
  .panel { background: rgba(255, 244, 228, 0.94); border-radius: 22px; padding: 22px 20px; width: min(360px, 100%);
           box-shadow: 0 10px 30px rgba(107, 52, 22, 0.25); text-align: center; max-height: 100%; overflow: auto; }
  .panel.clear { background: none; box-shadow: none; }
  h1 { margin: 0 0 4px; font-size: 38px; letter-spacing: -1px; color: var(--brown); text-shadow: 0 2px 0 #fff3e0; }
  h2 { margin: 0 0 14px; font-size: 24px; }
  .sub { margin: 0 0 18px; font-size: 14px; color: var(--brown2); font-weight: 600; }
  .stats { display: flex; justify-content: center; gap: 14px; font-weight: 800; font-size: 15px; margin-bottom: 18px; }
  .chip { background: rgba(255,255,255,0.75); padding: 6px 12px; border-radius: 99px; }
  button { font: inherit; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .btn { display: block; width: 100%; padding: 14px; margin: 8px 0; border-radius: 14px; font-size: 18px; font-weight: 800;
         background: var(--orange); color: #fff; box-shadow: 0 4px 0 #b9541f; transition: transform .06s; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b9541f; }
  .btn.sec { background: #fff; color: var(--brown); box-shadow: 0 4px 0 #e2c3a3; }
  .row { display: flex; gap: 8px; }
  .row .btn { flex: 1; font-size: 16px; }
  .help { font-size: 12.5px; color: var(--brown2); margin-top: 12px; line-height: 1.6; font-weight: 600; }
  .panel.clear .help { background: rgba(255, 244, 228, 0.85); border-radius: 12px; padding: 6px 10px; }
  .big { font-size: 46px; font-weight: 900; margin: 2px 0; }
  .badge { display: inline-block; background: #ffd34d; color: #6b3416; padding: 4px 12px; border-radius: 99px; font-weight: 900; font-size: 14px; margin: 4px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 8px; }
  .card { background: #fff; border-radius: 16px; padding: 8px 6px 10px; border: 3px solid transparent; color: var(--brown); }
  .card.sel { border-color: var(--orange); }
  .card canvas { width: 96px; height: 80px; display: block; margin: 0 auto; }
  .card .nm { font-weight: 800; font-size: 14px; }
  .card .st { font-size: 12px; font-weight: 700; color: var(--brown2); margin-top: 3px; }
  .card.locked canvas { filter: saturate(0.6); opacity: 0.5; }
  .msg { min-height: 20px; font-size: 13px; font-weight: 700; color: #c0392b; }
  table { width: 100%; border-collapse: collapse; font-weight: 700; margin-bottom: 8px; }
  td { padding: 7px 4px; border-bottom: 1px solid #f0dcc4; font-size: 15px; }
  td:first-child { width: 44px; color: var(--brown2); }
  td:last-child { text-align: right; color: var(--brown2); font-size: 13px; }
  tr.me td { background: #fff1c2; }
  .empty { padding: 18px 0; color: var(--brown2); font-weight: 600; }
  .btn.revive { background: #3aa76d; box-shadow: 0 4px 0 #2a7d51; }
  .btn.revive.off { background: #b9b2a8; box-shadow: 0 4px 0 #948c82; }
  .item { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 14px; padding: 10px; margin-bottom: 8px; text-align: left; }
  .item .ic { font-size: 28px; width: 36px; text-align: center; }
  .item .tx { flex: 1; }
  .item .nm { font-weight: 800; font-size: 15px; }
  .item .ds { font-size: 12px; color: var(--brown2); font-weight: 600; margin-top: 2px; }
  .item .lv { font-size: 12px; color: #3aa76d; font-weight: 800; margin-top: 2px; }
  .item button { background: var(--orange); color: #fff; font-weight: 800; border-radius: 10px; padding: 8px 10px; font-size: 14px; white-space: nowrap; }
  .item button.max { background: #c8c0b6; }
  #s-title { justify-content: flex-start; padding-top: max(40px, 7vh, env(safe-area-inset-top)); }
  @media (max-height: 560px) {
    #s-title { padding-top: 12px; }
    h1 { font-size: 28px; } .sub { margin-bottom: 8px; } .stats { margin-bottom: 8px; }
    .btn { padding: 9px; margin: 5px 0; font-size: 16px; } .help { display: none; }
    .big { font-size: 34px; } .panel { padding: 14px 16px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="s-title" class="screen on">
  <div class="panel clear">
    <h1>캥거루 점프</h1>
    <p class="sub">운명의 짝을 찾아 호주에서 한국까지!</p>
    <div class="stats"><span class="chip" id="t-best">🏆 0</span><span class="chip" id="t-coins">🪙 0</span></div>
    <button class="btn" id="b-start">시작하기</button>
    <div class="row">
      <button class="btn sec" id="b-chars">캐릭터</button>
      <button class="btn sec" id="b-shop">🛒 상점</button>
    </div>
    <div class="row">
      <button class="btn sec" id="b-rank">랭킹</button>
      <button class="btn sec" id="b-sound">소리 켜짐</button>
    </div>
    <div class="help">탭 = 점프 · 꾹 누르기 = 높이 점프 · 공중에서 탭 = 2단 점프<br>아주 높은 장애물은 2단 점프로 넘어요<br>🌿 유칼립투스 잎을 먹으면 5초 무적!</div>
  </div>
</div>

<div id="s-chars" class="screen">
  <div class="panel">
    <h2>캐릭터</h2>
    <div class="stats"><span class="chip" id="c-coins">🪙 0</span></div>
    <div class="grid" id="grid"></div>
    <div class="msg" id="c-msg"></div>
    <button class="btn sec" data-back>돌아가기</button>
  </div>
</div>

<div id="s-shop" class="screen">
  <div class="panel">
    <h2>🛒 상점</h2>
    <div class="stats"><span class="chip" id="sh-coins">🪙 0</span></div>
    <div id="shop-list"></div>
    <div class="msg" id="sh-msg"></div>
    <button class="btn sec" data-back>돌아가기</button>
  </div>
</div>

<div id="s-rank" class="screen">
  <div class="panel">
    <h2>내 기록 TOP 10</h2>
    <div id="rank-list"></div>
    <button class="btn sec" data-back>돌아가기</button>
  </div>
</div>

<div id="s-pause" class="screen">
  <div class="panel">
    <h2>일시정지</h2>
    <button class="btn" id="b-resume">계속하기</button>
    <button class="btn sec" id="b-quit">처음으로</button>
  </div>
</div>

<div id="s-over" class="screen">
  <div class="panel">
    <h2 id="o-title">으악!</h2>
    <div class="big" id="o-score">0</div>
    <div id="o-badge"></div>
    <div class="stats"><span class="chip" id="o-best">🏆 0</span><span class="chip" id="o-coins">🪙 +0</span></div>
    <button class="btn revive" id="b-revive">이어하기</button>
    <div class="msg" id="o-msg"></div>
    <button class="btn" id="b-again">다시 하기</button>
    <button class="btn sec" id="b-home">처음으로</button>
  </div>
</div>

<div id="s-clear" class="screen">
  <div class="panel">
    <h2 id="cl-title">💕 THE END 💕</h2>
    <p class="sub" id="cl-sub">캥거루는 한국 동물원에서 운명의 짝을 만났어요</p>
    <div class="big" id="cl-score">0</div>
    <div id="cl-badge"></div>
    <div class="stats"><span class="chip" id="cl-bonus">🪙 +100 보너스</span></div>
    <button class="btn" id="b-lap">2부: 동물원 탈출! 🏃</button>
    <button class="btn sec" id="b-home2">여기서 끝내기</button>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  let W = 0, H = 0, S = 1, groundY = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    const cw = window.innerWidth, ch = window.innerHeight;
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    S = Math.min(ch / 300, cw / 420);
    W = cw / S; H = ch / S;
    groundY = Math.min(H - 60, H * 0.5 + 110);
    if (roo && roo.onGround) roo.y = groundY;
  }

  // ---------- 캐릭터 ----------
  const CHARS = [
    { id: 'roo', name: '캥거루', fur: '#dc9a62', light: '#fbe7cf', dark: '#b06a38', ear: '#f0b4a0', eye: '#3a2414', cost: 0 },
    { id: 'wallaby', name: '왈라비', fur: '#8f7f6e', light: '#ddd3c6', dark: '#4f4438', ear: '#caa99b', eye: '#2a170c', cost: 200, scale: 0.88 },
    { id: 'white', name: '흰 캥거루', fur: '#f3eee6', light: '#ffffff', dark: '#b9ada0', ear: '#f2b8b8', eye: '#b8405a', cost: 500 },
    { id: 'tree', name: '나무타기캥거루', fur: '#6e3b22', light: '#e0aa6c', dark: '#3e1f12', ear: '#a8693f', eye: '#1a0d06', cost: 1200, roundEars: true },
    { id: 'boxer', name: '복서 캥거루', fur: '#b5683a', light: '#e8b98c', dark: '#6a3a1c', ear: '#e09a70', eye: '#2a170c', gloves: true, needScore: 1000 },
    { id: 'night', name: '별빛 캥거루', fur: '#3d4f86', light: '#a9b8ea', dark: '#202a4f', ear: '#7b8fd6', eye: '#ffe36b', cost: 3000, sparkle: true },
    { id: 'chibi', name: '말랑 캥거루', fur: '#eba86c', light: '#fff1dc', style: 'chibi', cost: 600 },
    { id: 'chubby', name: '통통 캥거루', fur: '#a8744a', light: '#ecd6b2', style: 'chubby', cost: 1500 },
    { id: 'ugly', name: '못난이 캥거루', fur: '#9a7f5a', style: 'ugly', needDeaths: 30 },
    { id: 'toon', name: '루루', fur: '#7cc6e6', light: '#fff5dd', dark: '#5aa6cc', ear: '#f7b6c8', eye: '#2b3f8a', style: 'toon', cost: 400 },
    { id: 'bm', name: '병맛 캥거루', fur: '#fffdf6', light: '#ffffff', dark: '#cccccc', ear: '#eeeeee', eye: '#1a1a1a', style: 'bm', cost: 777 },
    { id: 'traveler', name: '여행가 캥거루', fur: '#c98a4e', light: '#f0cfa2', dark: '#7a4a24', ear: '#eab08a', eye: '#2a170c', hat: true, needClear: true },
  ];
  const charById = id => CHARS.find(c => c.id === id) || CHARS[0];

  // ---------- 세계 여정 ----------
  const REGION_LEN = 700;                 // 지역 하나 길이 (점수)
  const FINISH = REGION_LEN * 6;          // 한국 끝 = 완주
  const REGIONS = [
    { name: '호주', flag: '🇦🇺', ground: '#c9632e', line: '#a94f22', dirt: '#b5552a', hill1: '#f0a868', hill2: '#de8550', rock: '#8d7f74',
      marks: ['opera', 'uluru'], bg: ['koala', 'emu'], obs: ['wombat', 'rock', 'bush', 'mound', 'wombat', 'bush'], tall: 'giantmound', bird: 'kookaburra' },
    { name: '케냐', flag: '🇰🇪', ground: '#c9a35a', line: '#a8843e', dirt: '#b8944c', hill1: '#e3cd92', hill2: '#cfb36e', rock: '#8d7f74',
      marks: ['kilimanjaro', 'acacia', 'acacia'], bg: ['elephant', 'zebra', 'lion'], obs: ['meerkat', 'warthog', 'rock', 'meerkat', 'mound'], tall: 'giraffe', bird: 'flamingo' },
    { name: '영국', flag: '🇬🇧', ground: '#5f9e4a', line: '#4c8a3a', dirt: '#559242', hill1: '#a6d08e', hill2: '#86bb6c', rock: '#8a8a84',
      marks: ['bigben', 'londoneye'], bg: ['sheep', 'guard', 'sheep'], obs: ['hedgehog', 'corgi', 'phonebox', 'postbox', 'hedgehog'], tall: 'bus', bird: 'robin' },
    { name: '페루', flag: '🇵🇪', ground: '#8f9a5e', line: '#76804a', dirt: '#848f55', hill1: '#a9bba6', hill2: '#86a284', rock: '#9a9384',
      marks: ['machupicchu', 'andes'], bg: ['alpaca'], obs: ['llama', 'guineapig', 'rock', 'llama', 'rocks'], tall: 'incawall', bird: 'condor' },
    { name: '미국', flag: '🇺🇸', ground: '#d0743a', line: '#b05e2c', dirt: '#bf6833', hill1: '#eba070', hill2: '#dd8752', rock: '#9a6a4a',
      marks: ['liberty', 'mesa'], bg: ['bison'], obs: ['skunk', 'prairiedog', 'cactus', 'tumble', 'skunk'], tall: 'saguaro', bird: 'eagle' },
    { name: '한국', flag: '🇰🇷', ground: '#7fae5a', line: '#668f46', dirt: '#729f50', hill1: '#9fc3a6', hill2: '#7aa88a', rock: '#8a8a84',
      marks: ['seoul', 'gate'], bg: ['tiger', 'bear'], obs: ['jindo', 'jangdok', 'harubang', 'jangdoks', 'jindo'], tall: 'cheomseongdae', bird: 'kkachi' },
  ];
  const ZOO_LEN = 600;
  const ZOO = [
    { name: '동물원 우리', flag: '🦁', ground: '#cdb88e', line: '#ad9870', dirt: '#bea97f', hill1: '#a8cf96', hill2: '#86b876', rock: '#8a8a84',
      marks: ['cage', 'cage'], bg: ['tiger', 'bear', 'zebra', 'elephant', 'lion'], obs: ['fence', 'trashcan', 'keeper', 'trashcan'], tall: 'bars', bird: 'pigeon' },
    { name: '놀이 광장', flag: '🎡', ground: '#d9c9b2', line: '#b8a68c', dirt: '#cbb9a0', hill1: '#bcd9ea', hill2: '#a3c8de', rock: '#8a8a84',
      marks: ['ferris', 'cage'], bg: ['sheep', 'alpaca'], obs: ['icecart', 'stroller', 'trashcan', 'cone'], tall: 'balloons', bird: 'pigeon' },
    { name: '정문', flag: '🚪', ground: '#b9b2a6', line: '#9a9286', dirt: '#aaa397', hill1: '#c9d6b8', hill2: '#aec29a', rock: '#8a8a84',
      marks: ['cage', 'ferris'], bg: ['bear', 'tiger'], obs: ['keeper', 'cone', 'keeper', 'trashcan', 'fence'], tall: 'bars', bird: 'pigeon' },
  ];
  const OB = {
    fence: [50, 24], trashcan: [22, 30], icecart: [44, 41], keeper: [24, 48], cone: [18, 24], stroller: [38, 34], bars: [40, 172], balloons: [36, 172],
    rock: [28, 22], rocks: [54, 20], bush: [34, 38], mound: [24, 50], giantmound: [38, 172], wombat: [32, 22],
    meerkat: [16, 32], warthog: [40, 26], giraffe: [44, 165],
    hedgehog: [26, 18], corgi: [40, 26], phonebox: [24, 50], postbox: [20, 36], bus: [100, 150],
    llama: [34, 46], guineapig: [24, 16], incawall: [40, 172],
    skunk: [36, 24], prairiedog: [14, 26], cactus: [22, 46], tumble: [28, 28], saguaro: [34, 172],
    jindo: [36, 30], jangdok: [28, 30], jangdoks: [56, 28], harubang: [24, 46], cheomseongdae: [40, 172],
  };
  const BIRDS = {   // 몸, 배, 머리, 부리, 날개
    kookaburra: ['#8a6a4a', '#f1ead8', '#f1ead8', '#3a3a3a', '#5f86ad'],
    flamingo: ['#f48fb1', '#f8bbd0', '#f48fb1', '#2b2b2b', '#e75480'],
    robin: ['#8a6a50', '#e86a3a', '#8a6a50', '#333333', '#6f5440'],
    condor: ['#1e1e1e', '#f4f4f4', '#d98a7a', '#e8d8b0', '#2b2b2b'],
    eagle: ['#4a2f1d', '#5a3a24', '#ffffff', '#f2c230', '#3a2416'],
    kkachi: ['#151a2a', '#f4f4f4', '#151a2a', '#2b2b2b', '#24407a'],
    pigeon: ['#8d93a0', '#c9ccd4', '#6a7180', '#e0b48a', '#737a88'],
  };
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const rgb = a => `rgb(${a[0]},${a[1]},${a[2]})`;
  const mixArr = (a, b, k) => a.map((x, j) => Math.round(x + (b[j] - x) * k));

  // ---------- 저장 ----------
  const SAVE_KEY = 'roo-save-v1';
  let save = { best: 0, coins: 0, owned: ['roo'], sel: 'roo', ranks: [], muted: false, cleared: 0, deaths: 0, shields: 0, upInv: 0, upMag: 0, upLeaf: 0 };
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) save = Object.assign(save, JSON.parse(raw));
  } catch (e) {}
  function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

  // ---------- 사운드 / 진동 ----------
  let ac = null;
  function initAudio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
  }
  function beep(f1, f2, dur, type = 'square', vol = 0.05, delay = 0) {
    if (!ac || save.muted) return;
    try {
      const t0 = ac.currentTime + delay;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f1, t0);
      o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }
  function fanfare() { [523, 659, 784, 1046].forEach((f, i) => beep(f, f * 1.01, 0.14, 'triangle', 0.06, i * 0.1)); }
  function vib(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

  // ---------- 상태 ----------
  const G = 2200, G_HOLD = 990, JUMP_V = -560, DJUMP_V = -500, DAY_LEN = 110, INV_TIME = 5;
  let state = 'menu', t = 0;
  let speed, maxSpeed, dist, bonus, score, runCoins, committed, lastMilestone, flash, inv, shake, runTime, lap;
  let route = REGIONS, routeStart = 0, chapter = 1, prevObj = REGIONS[0], storyT = 0, partner = null, yHist = [];
  let curRegion = 0, prevRegion = 0, blend = 1, banner = null, tallHinted = false, fwT = 0;
  let fx = [], trailT = 0, revives = 0, pendingRank = false, distBonusGiven = 0;
  let roo = null, obs = [], coins = [], items = [], dust = [], pops = [], marks = [], bgs = [], toNext = 0, nextMark = 0, nextBg = 0, holding = false;
  let hills1 = [], hills2 = [], clouds = [], stars = [];

  function reset() {
    speed = 300; maxSpeed = 780; dist = 0; bonus = 0; score = 0; runCoins = 0; committed = 0;
    lastMilestone = 0; flash = 0; inv = 0; shake = 0; runTime = 0; lap = 0;
    curRegion = 0; prevRegion = 0; blend = 1; banner = null; tallHinted = false;
    route = REGIONS; routeStart = 0; chapter = 1; prevObj = REGIONS[0]; storyT = 0; partner = null; yHist = [];
    roo = { x: 60, y: groundY, vy: 0, onGround: true, jumps: 0, dead: false, sq: 0, sqType: '', trail: [], flip: 0, shield: false }; fx = []; revives = 0; pendingRank = false; distBonusGiven = 0;
    obs = []; coins = []; items = []; dust = []; pops = []; toNext = 460;
    marks = [{ x: (W || 420) * 0.45, kind: REGIONS[0].marks[0] }]; nextMark = 700;
    bgs = [{ x: (W || 420) * 0.78, kind: REGIONS[0].bg[0] }]; nextBg = 420;
  }
  function initScenery() {
    for (let i = 0; i < 6; i++) hills1.push({ x: i * 220 + Math.random() * 60, w: 260 + Math.random() * 140, h: 50 + Math.random() * 40 });
    for (let i = 0; i < 8; i++) hills2.push({ x: i * 160 + Math.random() * 40, w: 180 + Math.random() * 80, h: 26 + Math.random() * 24 });
    for (let i = 0; i < 5; i++) clouds.push({ x: Math.random() * 900, y: 30 + Math.random() * 120, s: 0.7 + Math.random() * 0.6 });
    for (let i = 0; i < 70; i++) stars.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.3 + 0.4, p: Math.random() * 6 });
  }
  resize(); reset(); initScenery();
  window.addEventListener('resize', resize);

  const journey = () => Math.floor(dist / 12);
  const lapPos = () => journey() - routeStart;

  // ---------- 생성 ----------

  const TALL_SCALE = 0.82;   // 2단 점프 장애물 높이 (원래 그림 대비)
  function makeOb(type, x, tall) {

  function spawn(gap) {

      else if (c < 0.66) for (let i = 0; i < 4; i++) coins.push({ x: after - 30 + i * 22, y: groundY - 16 });

  function puff(x, y, n, rgbs) {

  // ---------- 업데이트 ----------
  function update(dt) {
    t += dt;
    const playing = state === 'play';
    const scroll = playing ? speed : (state === 'menu' ? 70 : (state === 'clear' ? 40 : 0));
    if (state !== 'paused') {
      for (const h of hills1) { h.x -= scroll * 0.15 * dt; if (h.x + h.w < -20) h.x += 6 * 220; }
      for (const h of hills2) { h.x -= scroll * 0.35 * dt; if (h.x + h.w < -20) h.x += 8 * 160; }
      for (const c of clouds) { c.x -= (scroll * 0.06 + 6) * dt; if (c.x < -120) { c.x = W + rand(20, 200); c.y = 30 + Math.random() * 120; } }
      for (const m of marks) m.x -= scroll * 0.22 * dt;
      marks = marks.filter(m => m.x > -320);
      nextMark -= scroll * 0.22 * dt;
      if (nextMark <= 0) { marks.push({ x: W + 30, kind: pick(route[curRegion].marks) }); nextMark = rand(560, 820); }
      for (const a of bgs) a.x -= scroll * 0.5 * dt;
      bgs = bgs.filter(a => a.x > -160);
      nextBg -= scroll * 0.5 * dt;
      if (nextBg <= 0) { bgs.push({ x: W + 20, kind: pick(route[curRegion].bg) }); nextBg = rand(1100, 1800); }
      for (const d of dust) { d.x += (d.vx - (d.still ? 0 : scroll)) * dt; d.y += d.vy * dt; if (!d.heart) d.vy += 300 * dt; d.life -= dt; }
      dust = dust.filter(d => d.life > 0);
      for (const f of fx) { f.r += 110 * dt; f.life -= dt; f.x -= scroll * dt; }
      fx = fx.filter(f => f.life > 0);
      if (roo.sq > 0) roo.sq -= dt;
      for (const g of roo.trail) { g.life -= dt; g.x -= scroll * dt; }
      roo.trail = roo.trail.filter(g => g.life > 0);
      if (roo.flip > 0) roo.flip -= dt;
      for (const p of pops) { p.y -= (p.big || p.say ? 8 : 40) * dt; p.life -= dt; }
      pops = pops.filter(p => p.life > 0);
      if (flash > 0) flash -= dt;
      if (shake > 0) shake -= dt;
      if (blend < 1) blend = Math.min(1, blend + dt / 2.5);
      if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }
    }
    if (state === 'clear') {
      roo.y = groundY; fwT -= dt; storyT += dt;
      if (chapter === 1 && partner) {
        const target = roo.x + 64;
        if (partner.x > target) partner.x = Math.max(target, partner.x - 150 * dt);
        if (storyT > 0.5 && !partner.s1) { partner.s1 = true; pops.push({ x: roo.x + 30, y: groundY - 95, txt: '여기가... 한국 동물원?', life: 1.8, say: true }); }
        if (storyT > 2.4 && !partner.s2) { partner.s2 = true; pops.push({ x: partner.x + 26, y: groundY - 95, txt: '어서 와! 기다렸어 💕', life: 2.2, say: true }); beep(880, 1320, 0.2, 'triangle', 0.05); }
        if (storyT > 2.4 && fwT <= 0) { fwT = 0.22; dust.push({ x: rand(roo.x + 30, roo.x + 90), y: groundY - 50, vx: rand(-15, 15), vy: rand(-70, -40), life: 1.6, max: 1.6, c: '255,105,150', still: true, heart: true }); }
        return;
      }
      if (fwT <= 0) {
        fwT = 0.38;
        const cols = ['255,90,90', '255,210,80', '120,200,255', '160,255,160', '255,150,230'];
        sparks(rand(W * 0.15, W * 0.85), rand(groundY - 230, groundY - 110), 26, pick(cols), 170);
        beep(rand(300, 500), 90, 0.18, 'triangle', 0.03);
      }
      return;
    }
    if (!playing) { if (state === 'menu') roo.y = groundY; return; }

    runTime += dt;
    speed = Math.min(maxSpeed, speed + 7 * dt);
    dist += speed * dt;
    score = journey() + bonus;
    if (Math.floor(score / 100) > lastMilestone) {
      lastMilestone = Math.floor(score / 100); flash = 0.6;
      beep(880, 1320, 0.12, 'triangle', 0.06); beep(1320, 1760, 0.12, 'triangle', 0.05, 0.1);
    }
    if (inv > 0) { inv -= dt; if (inv <= 0) beep(700, 300, 0.25, 'triangle', 0.05); }

    // 지역 이동
    const lp = lapPos();
    const ri = Math.max(0, Math.min(route.length - 1, Math.floor(lp / segLen())));
    if (ri !== curRegion) {
      prevObj = route[curRegion]; prevRegion = curRegion; curRegion = ri; blend = 0;
      marks = marks.filter(m => m.x < W); bgs = bgs.filter(m => m.x < W); nextMark = Math.min(nextMark, 60); nextBg = Math.min(nextBg, 30);
      const R = route[ri];
      banner = { txt: route === ZOO ? (ri === 2 ? '🚪 정문이 보인다! 조금만 더!' : `${R.flag} ${R.name}로 도망치자!`) : `✈️ ${R.flag} ${R.name} 도착!`, life: 3, max: 3 };
      fanfare();
    }
    if (lp >= routeLen()) { clearRun(); return; }

    // 캥거루
    if (!roo.onGround) {
      const g = (holding && roo.vy < 0) ? G_HOLD : G;
      roo.vy += g * dt;
      roo.y += roo.vy * dt;
      if (roo.y >= groundY) {
        roo.y = groundY; roo.vy = 0; roo.onGround = true; roo.jumps = 0; roo.sq = 0.12; roo.sqType = 'land'; roo.flip = 0;
        puff(roo.x + 22, groundY, 5, '120,70,40');
      }
    }

    // 생성·이동
    toNext -= speed * dt;
    if (toNext <= 0) { const gap = speed * rand(0.75, 1.5) + 150; toNext = gap + spawn(gap); }
    for (const o of obs) {
      if (o.dead) { o.x += o.vx * dt; o.y += o.vy * dt; o.vy += G * dt; o.rot += o.vr * dt; }
      else { o.x -= speed * dt; if (o.type === 'bird') o.x -= 40 * dt; if (o.type === 'tumble') { o.x -= 70 * dt; o.rot = (o.rot || 0) - 6 * dt; } }
    }
    obs = obs.filter(o => o.x + o.w > -60 && o.y < H + 100);
    for (const c of coins) c.x -= speed * dt;
    coins = coins.filter(c => c.x > -20 && !c.got);
    for (const it of items) it.x -= speed * dt;

        ctx.strokeStyle = '#8a7a6a'; ctx.lineWidth = 0.9;

        for (const [bx, by] of tops) { ctx.beginPath(); ctx.moveTo(x + w / 2, b - 6); ctx.quadraticCurveTo(x + bx, b - by * 0.5, x + bx, b - by + 9); ctx.stroke(); }
        RR(x + w / 2 - 6, b - 8, 12, 8, 2); P('#a88a6a');
        const cols = ['#ff7a8a', '#ffd34d', '#7ac8f0', '#9fd88a', '#c79bf0', '#ffa86a'];
        tops.forEach(([bx, by], i) => { E(x + bx, b - by, 8, 10); P(cols[i]); E(x + bx - 2.5, b - by - 3, 2, 3); F('rgba(255,255,255,0.6)'); });
        break;
      }
      case 'jangdok': jangdok(x, b, 1); break;
      case 'jangdoks': jangdok(x, b, 1); jangdok(x + 30, b, 0.85); break;
      case 'harubang':
        RR(x + 3, b - 30, 18, 30, 7); P('#7d7a72');
        E(x + 12, b - 34, 9, 8); P('#7d7a72');
        E(x + 12, b - 40, 9.5, 7, Math.PI, Math.PI * 2); P('#6d6a63');
        E(x + 9, b - 35, 2, 1.6); F('#2e2c28'); E(x + 15, b - 35, 2, 1.6); F('#2e2c28');
        E(x + 12, b - 31.5, 2.4, 2); P('#7d7a72', 1);
        ctx.strokeStyle = OUTL; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(x + 7, b - 18); ctx.lineTo(x + 17, b - 20); ctx.stroke();
        break;
      case 'cheomseongdae': {
        const cx = x + w / 2;
        ctx.beginPath(); ctx.moveTo(x, b); ctx.quadraticCurveTo(x - 2, b - 70, cx - 10, b - 150); ctx.lineTo(cx + 10, b - 150);
        ctx.quadraticCurveTo(x + w + 2, b - 70, x + w, b); ctx.closePath(); P('#cbbf9e');
        ctx.strokeStyle = 'rgba(90,70,40,0.35)'; ctx.lineWidth = 1;
        for (let i = 1; i < 14; i++) { const yy = b - i * 10.5, k = i * 10.5 / 150, half = (w / 2) * (1 - k * k * 0.55); ctx.beginPath(); ctx.moveTo(cx - half, yy); ctx.lineTo(cx + half, yy); ctx.stroke(); }
        RR(cx - 5, b - 92, 10, 10, 1); F('#3a2e20');
        RR(cx - 13, b - 160, 26, 5, 1); P('#bdb08e'); RR(cx - 13, b - h, 26, 5, 1); P('#bdb08e');
        ctx.fillStyle = '#bdb08e'; ctx.fillRect(cx - 12, b - 166, 3, 7); ctx.fillRect(cx + 9, b - 166, 3, 7);
        break;
      }
    }
    ctx.restore();
    lineCol = OUTL; lineMul = 0.8;
  }

  // ---------- 사육사 ----------
  function drawKeeper(x, b, dir) {
    ctx.save();
    if (dir < 0) { ctx.translate(x + 24, 0); ctx.scale(-1, 1); x = 0; }
    const run = Math.sin(t * 14) * 3;
    ctx.strokeStyle = '#3e4a2e'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x + 10, b - 18); ctx.lineTo(x + 8 + run, b - 1); ctx.moveTo(x + 14, b - 18); ctx.lineTo(x + 16 - run, b - 1); ctx.stroke();
    RR(x + 5, b - 36, 14, 20, 4); P('#6f9a52');
    RR(x + 5, b - 22, 14, 4, 1); P('#5a4030');
    E(x + 12, b - 42, 6, 6); P('#f2c9a4');
    E(x + 12, b - 46, 6.5, 3, Math.PI, Math.PI * 2); P('#6f9a52'); RR(x + 12, b - 47, 8, 2.2, 1); P('#6f9a52', 1);
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(x + 15, b - 42, 0.9, 0, Math.PI * 2); ctx.fill();
    // 잠자리채
    ctx.strokeStyle = '#8a6a4a'; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(x + 16, b - 30); ctx.lineTo(x + 28, b - 44); ctx.stroke();
    ctx.strokeStyle = '#555'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.ellipse(x + 31, b - 48, 5, 6, -0.6, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(80,80,80,0.5)'; ctx.lineWidth = 0.7;
    ctx.beginPath(); ctx.moveTo(x + 28, b - 52); ctx.lineTo(x + 34, b - 44); ctx.moveTo(x + 27, b - 47); ctx.lineTo(x + 35, b - 49); ctx.stroke();
    ctx.restore();
  }
  // ---------- 동물원 배경 ----------
  function drawZooMark(m, x, b) {
    switch (m.kind) {
      case 'cage': {
        RR(x, b - 70, 150, 70, 2); F('#e6dcc6');
        E(x + 60, b - 18, 22, 12); F('#c98a4a'); E(x + 40, b - 26, 9, 9); F('#c98a4a'); E(x + 40, b - 26, 13, 13); F('rgba(150,90,40,0.35)');
        ctx.strokeStyle = '#7d8290'; ctx.lineWidth = 2.4;
        for (let i = 0; i <= 15; i++) { ctx.beginPath(); ctx.moveTo(x + i * 10, b - 70); ctx.lineTo(x + i * 10, b); ctx.stroke(); }
        RR(x - 3, b - 74, 156, 6, 2); F('#6d7280');
        break;
      }
      case 'ferris': {
        const cx = x + 70, cy = b - 84, r = 62;
        ctx.strokeStyle = '#f0f0f0'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
        ctx.lineWidth = 1;
        const cols = ['#ff7a8a', '#ffd34d', '#7ac8f0', '#9fd88a', '#c79bf0', '#ffa86a'];
        for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2 + t * 0.15; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.stroke();
          RR(cx + Math.cos(a) * r - 4, cy + Math.sin(a) * r, 8, 7, 2); F(cols[i % 6]); }
        ctx.strokeStyle = '#d8d8d8'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx - 34, b); ctx.lineTo(cx, cy); ctx.lineTo(cx + 34, b); ctx.stroke();
        break;
      }
      case 'zoogate':
        drawGate(x, b, '한국 동물원', '#3f7a4a');
        break;
    }
  }
  function drawGate(x, b, label, col) {
    RR(x, b - 100, 14, 100, 2); P('#c9a86a'); RR(x + 136, b - 100, 14, 100, 2); P('#c9a86a');
    ctx.beginPath(); ctx.moveTo(x - 6, b - 100); ctx.quadraticCurveTo(x + 75, b - 142, x + 156, b - 100); ctx.lineTo(x + 156, b - 92); ctx.quadraticCurveTo(x + 75, b - 132, x - 6, b - 92); ctx.closePath(); P(col);
    RR(x + 25, b - 128, 100, 22, 6); P('#fff8e6');
    text(label, x + 75, b - 116.5, 13, col, 'center', 900);
    E(x + 7, b - 104, 8, 8); P('#ffd34d'); E(x + 143, b - 104, 8, 8); P('#ff9eb5');
  }

  // ---------- 짝 캥거루 ----------
  const PARTNER = { id: 'partner', name: '짝', fur: '#e6a184', light: '#fde9dc', dark: '#c07a5c', ear: '#f7a8b8', eye: '#3a2414', bow: true };
  function drawPartner(px, py, face, o) {
    ctx.save();
    if (face < 0) { ctx.translate(px + 52, py); ctx.scale(-1, 1); } else ctx.translate(px, py);
    drawRoo(ctx, PARTNER, o);
    ctx.restore();
  }
  function drawCoin(c) {
    const w = Math.max(1.2, Math.abs(Math.cos(t * 5 + c.x * 0.03)) * 7);
    ctx.fillStyle = '#c48e12'; ctx.beginPath(); ctx.ellipse(c.x, c.y, w, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd34d'; ctx.beginPath(); ctx.ellipse(c.x, c.y, Math.max(0.6, w - 1.8), 5.2, 0, 0, Math.PI * 2); ctx.fill();
    if (w > 4) { ctx.fillStyle = '#fff3b0'; ctx.fillRect(c.x - 0.8, c.y - 3, 1.6, 6); }
  }
  function drawLeaf(x, y, size = 1) {
    ctx.save(); ctx.translate(x, y); ctx.scale(size, size);
    const pulse = 0.5 + 0.5 * Math.sin(t * 6);
    ctx.fillStyle = `rgba(160,240,170,${0.3 + 0.2 * pulse})`;
    ctx.beginPath(); ctx.arc(0, 0, 15 + pulse * 3, 0, Math.PI * 2); ctx.fill();
    ctx.rotate(-0.6 + Math.sin(t * 3) * 0.15);
    ctx.beginPath(); ctx.ellipse(0, 0, 4.5, 12, 0, 0, Math.PI * 2); P('#5f9e7a', 1.2);
    ctx.fillStyle = '#8cc9a3'; ctx.beginPath(); ctx.ellipse(-1.2, -1, 2, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function drawFinish() {
    const lp = lapPos(), fin = routeLen();
    if (state !== 'clear' && lp < fin - 70) return;
    const x = state === 'clear' ? roo.x - 30 : roo.x - 30 + (fin - lp) * 12;
    if (x > W + 60) return;
    patOX = x; patOY = groundY; lineCol = '#3a2010'; lineMul = 1;
    if (chapter === 1) drawGate(x, groundY, '🇰🇷 한국 동물원', '#3f7a4a'); else drawGate(x, groundY, '🚪 출구 EXIT', '#b0452e');
    lineCol = OUTL; lineMul = 0.8;
  }

  function text(str, x, y, size, color, align = 'center', weight = 800) {
    ctx.font = `${weight} ${size}px system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.fillStyle = color; ctx.fillText(str, x, y);
  }
  function pill(str, x, y, size, bg, fg) {
    ctx.font = `900 ${size}px system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`;
    const w = ctx.measureText(str).width + size * 1.6, h = size * 2;
    RR(x - w / 2, y - h / 2, w, h, h / 2); ctx.fillStyle = bg; ctx.fill();
    text(str, x, y + 1, size, fg, 'center', 900);
  }
  const pad = n => String(n).padStart(5, '0');
  const hudY = () => Math.max(26, groundY - 250);

  function drawMap(y, col) {
    const x0 = 28, x1 = W - 28, seg = (x1 - x0) / route.length;
    ctx.strokeStyle = col; ctx.globalAlpha = 0.35; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); ctx.globalAlpha = 1;
    const prog = Math.max(0, Math.min(1, lapPos() / routeLen()));
    ctx.strokeStyle = '#ffb347'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + (x1 - x0) * prog, y); ctx.stroke();
    ctx.font = '11px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    route.forEach((r, i) => { ctx.globalAlpha = i <= curRegion ? 1 : 0.45; ctx.fillText(r.flag, x0 + seg * i + seg / 2, y + 12); });
    ctx.globalAlpha = 1;
    ctx.save(); ctx.translate(x0 + (x1 - x0) * prog - 4, y + 3); ctx.scale(0.24, 0.24);
    drawRoo(ctx, charById(save.sel), { air: false, dead: false, bob: 0, tilt: 0, time: 0 }); ctx.restore();
    ctx.font = '12px system-ui, sans-serif'; ctx.fillText('🏁', x1 + 10, y);
  }

  function draw() {
    let sx = 0, sy = 0;
    if (shake > 0) { sx = (Math.random() - 0.5) * shake * 26; sy = (Math.random() - 0.5) * shake * 26; }
    ctx.setTransform(dpr * S, 0, 0, dpr * S, dpr * S * sx, dpr * S * sy);
    const phase = state === 'menu' ? 0.44 : ((0.05 + runTime / DAY_LEN) % 1);
    const sk = skyAt(phase);
    ctx.fillStyle = rgb(sk.top); ctx.fillRect(-20, -20, W + 40, H + 40);
    drawSky(sk);
    drawHills(hills1, regionColor('hill1'), groundY);
    for (const m of marks) drawMark(m);
    drawHills(hills2, regionColor('hill2'), groundY);
    ctx.fillStyle = regionColor('hill2'); ctx.fillRect(-20, groundY - 30, W + 40, 31);
    for (const a of bgs) drawBgAnimal(a);
    lineCol = OUTL; lineMul = 0.8;
    ctx.fillStyle = `rgba(${sk.bot.join(',')},0.34)`; ctx.fillRect(-20, -20, W + 40, groundY + 20);
    drawGround();
    if (sk.n > 0) { ctx.fillStyle = `rgba(12,20,52,${sk.n * 0.5})`; ctx.fillRect(-20, -20, W + 40, H + 40); }

    drawFinish();
    for (const c of coins) drawCoin(c);
    for (const it of items) drawLeaf(it.x, it.y);
    for (const o of obs) drawObs(o);
    for (const d of dust) {
      ctx.fillStyle = `rgba(${d.c},${Math.max(0, d.life / d.max) * 0.85})`;
      if (d.heart) { text('♥', d.x, d.y, 14, `rgba(${d.c},${Math.max(0, d.life / d.max)})`, 'center', 900); }
      else if (d.star) { const r = 4.5; ctx.beginPath(); for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 + t * 4, rr = k % 2 ? r * 0.38 : r; ctx.lineTo(d.x + Math.cos(a) * rr, d.y + Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(d.x, d.y, d.still ? 2.2 : 3, 0, Math.PI * 2); ctx.fill(); }
    }
    for (const f of fx) {
      ctx.strokeStyle = `rgba(${f.col},${(f.life / f.max) * 0.9})`; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(f.x, f.y, f.r * (f.flat ? 1.6 : 1), f.flat ? f.r * 0.35 : f.r, 0, 0, Math.PI * 2); ctx.stroke();
    }

    if (partner) {
      if (state === 'play' && chapter === 2) { yHist.push(roo.y); if (yHist.length > 9) yHist.shift(); partner.y = yHist[0]; }
      const py = partner.y != null && chapter === 2 && state !== 'clear' ? partner.y : groundY;
      const pAir = py < groundY - 1, moving = state === 'play' || (state === 'clear' && partner.x > roo.x + 64.5);
      const pb = (!pAir && moving) ? -Math.abs(Math.sin(t * 11 + 1)) * 6 : 0;
      const pm = state === 'clear' && chapter === 1 && storyT > 2.4 ? { air: true, vy: -1 } : { air: pAir, vy: pAir ? -1 : 0 };
      drawPartner(partner.x, py, partner.face || 1, { air: pm.air, vy: pm.vy, dead: false, bob: pb, tilt: 0, time: t + 0.7, run: moving });
    }
    const ch = charById(save.sel);
    let bob = 0, tilt = 0;
    const air = !roo.onGround;
    if (!air && !roo.dead && state !== 'paused') {
      const fast = state === 'play', party = state === 'clear';
      const ph = Math.abs(Math.sin(t * (fast ? 11 : party ? 7 : 4)));
      bob = -ph * (fast ? 7 : party ? 16 : 2);
    }
    if (air) tilt = Math.max(-0.35, Math.min(0.3, roo.vy / 1800));
    if (roo.shield && !roo.dead) {
      ctx.strokeStyle = `rgba(120,200,255,${0.6 + 0.25 * Math.sin(t * 6)})`; ctx.lineWidth = 2.4;
      ctx.fillStyle = 'rgba(160,220,255,0.18)';
      ctx.beginPath(); ctx.ellipse(roo.x + 20, roo.y - 30 + bob, 38, 40, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    if (inv > 0) {
      const a = inv < 1.2 ? (Math.sin(t * 30) > 0 ? 0.55 : 0.15) : 0.45 + 0.15 * Math.sin(t * 10);
      ctx.fillStyle = `rgba(255,236,120,${a})`;
      ctx.beginPath(); ctx.ellipse(roo.x + 22, roo.y - 26 + bob, 32, 36, 0, 0, Math.PI * 2); ctx.fill();
    }
    if (roo.flip > 0 && !roo.onGround) tilt = (1 - roo.flip / 0.42) * Math.PI * 2;
    let sxq = 1, syq = 1;
    if (roo.sq > 0) { const k = roo.sq / 0.14; if (roo.sqType === 'up') { sxq = 1 - 0.12 * k; syq = 1 + 0.16 * k; } else { sxq = 1 + 0.16 * k; syq = 1 - 0.18 * k; } }
    ctx.save(); ctx.translate(roo.x + 22, roo.y); ctx.scale(sxq, syq); ctx.translate(-22, 0);
    drawRoo(ctx, ch, { air, dead: roo.dead, bob, tilt, time: t, vy: roo.vy, run: state === 'play' });
    ctx.restore();

    const night = sk.n > 0.5;
    for (const p of pops) {
      const a = Math.min(1, p.life * 2);
      if (p.say) { ctx.globalAlpha = a; pill(p.txt, p.x, p.y, 11, 'rgba(255,255,255,0.96)', '#6b3416'); ctx.globalAlpha = 1; }
      else if (p.big) { ctx.globalAlpha = a; pill(p.txt, p.x, p.y, 13, 'rgba(192,57,43,0.92)', '#fff'); ctx.globalAlpha = 1; }
      else text(p.txt, p.x, p.y, 14, `rgba(255,255,255,${a})`, 'center', 900);
    }

    if (state !== 'menu') {
      const y = hudY();
      const col = night ? '#fff4e4' : '#6b3416';
      const r = pauseRect();
      ctx.fillStyle = night ? 'rgba(255,255,255,0.18)' : 'rgba(255,255,255,0.55)';
      RR(r.x, r.y, r.w, r.h, 9); ctx.fill();
      ctx.fillStyle = col; ctx.fillRect(r.x + 11, r.y + 9, 4, 14); ctx.fillRect(r.x + 19, r.y + 9, 4, 14);
      drawCoin({ x: 58, y }); text(String(runCoins), 70, y + 1, 16, col, 'left');
      const blink = flash > 0 && Math.floor(flash * 10) % 2 === 0;
      text(`HI ${pad(Math.max(save.best, score))}`, W - 80, y + 1, 13, night ? 'rgba(255,244,228,0.7)' : 'rgba(107,52,22,0.6)', 'right', 700);
      if (!blink) text(pad(score), W - 12, y + 1, 17, col, 'right');
      drawMap(y + 28, col);
      if (inv > 0) {
        const bw = 90, bx = W / 2 - bw / 2, by = y + 52;
        drawLeaf(bx - 14, by + 3, 0.6);
        ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(bx, by, bw, 6);
        ctx.fillStyle = '#7fd197'; ctx.fillRect(bx, by, bw * Math.max(0, inv / invTime()), 6);
      }
      if (banner) {
        const a = Math.min(1, banner.life * 1.5, (banner.max - banner.life) * 4 + 0.2);
        ctx.globalAlpha = Math.max(0, a);
        pill(banner.txt, W / 2, y + 82, 17, 'rgba(255,255,255,0.92)', '#6b3416');
        ctx.globalAlpha = 1;
      }
    }
  }

  // ---------- 루프 ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    update(dt); draw();
    requestAnimationFrame(loop);
  }
  refreshTitle();
  requestAnimationFrame(loop);

  // 아이콘·스크린샷 제작용
  window.RooArt = { drawRoo, CHARS };

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
  }
})();
</script>
</body>
</html>
